<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layered Insights GIS — PM Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>
  :root{
    --ink:#1c231f; --ink-faint:#6b756e; --surface:#fff; --bg:#f4f5f3;
    --line:#e2e5e0; --accent:#2f6f5e; --accent-ink:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Public Sans',system-ui,sans-serif; color:var(--ink); background:var(--bg);
    display:flex; flex-direction:column;
  }
  h1,h2{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  header{
    background:var(--surface); border-bottom:1px solid var(--line); padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:15px;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-text .name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .brand-text .sub{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .session{display:flex; align-items:center; gap:14px; font-size:14px;}
  button{
    font-family:inherit; font-size:14px; font-weight:600; border-radius:8px; cursor:pointer; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); padding:8px 14px;
  }
  button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); width:100%;}
  [hidden]{display:none !important;}

  /* ---- login ---- */
  #loginView{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px;
    width:100%; max-width:360px;
  }
  .login-card h1{font-size:22px; margin-bottom:6px;}
  .login-card p{color:var(--ink-faint); font-size:14px; margin:0 0 20px;}
  label{display:block; font-size:12px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px;
    font-family:inherit; margin-bottom:16px; background:var(--bg);
  }
  #loginError{color:#b3413a; font-size:13px; min-height:18px; margin-top:6px;}

  /* ---- map view ---- */
  #mapView{flex:1; display:flex; min-height:0;}
  #sidebar{
    width:260px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
    overflow-y:auto; padding:16px;
  }
  #sidebar h2{font-size:14px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;}
  #layerToggles{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .layer-toggle{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; cursor:pointer;}
  .layer-toggle input{width:auto; margin:0;}
  .bookmark-btn{
    display:block; width:100%; text-align:left; background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; cursor:pointer;
  }
  .bookmark-btn:hover{border-color:var(--accent);}
  .bookmark-btn .b-name{display:block; font-weight:600; margin-bottom:2px;}
  .bookmark-btn .b-addr{display:block; color:var(--ink-faint); font-size:12px;}
  .bookmark-btn.active{border-color:var(--accent); background:#eaf2ef;}
  #floorSection{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  #floorButtons{display:flex; flex-wrap:wrap; gap:6px;}
  #floorButtons p{font-size:12px; color:var(--ink-faint); margin:0;}
  .floor-btn{
    background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px;
  }
  .floor-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  #mapContainer{flex:1; position:relative;}
  #mapStatus{
    position:absolute; top:12px; left:12px; z-index:10; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:13px; color:var(--ink-faint);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">LI</div>
    <div class="brand-text">
      <span class="name">Layered Insights GIS</span>
      <span class="sub">Property Manager</span>
    </div>
  </div>
  <div class="session" id="sessionBar" hidden>
    <span id="pmName"></span>
    <button id="logoutBtn">Sign out</button>
  </div>
</header>

<section id="loginView">
  <div class="login-card">
    <h1>PM Sign in</h1>
    <p>View and manage all properties on the map.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
      <div id="loginError"></div>
    </form>
  </div>
</section>

<section id="mapView" hidden>
  <div id="sidebar">
    <div id="layerToggles">
      <h2>Layers</h2>
      <!-- checkboxes populated once the map/layers exist, see initMap() -->
    </div>
    <div id="floorSection">
      <h2>Floor</h2>
      <div id="floorButtons"><p>Select a building below to filter by floor.</p></div>
    </div>
    <h2>Properties</h2>
    <div id="bookmarkList">Loading…</div>
  </div>
  <div id="mapContainer">
    <div id="mapStatus" hidden></div>
  </div>
</section>

<script src="https://js.arcgis.com/4.30/"></script>
<script>
(function(){
  var loginView = document.getElementById('loginView');
  var mapView = document.getElementById('mapView');
  var sessionBar = document.getElementById('sessionBar');
  var pmName = document.getElementById('pmName');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var bookmarkList = document.getElementById('bookmarkList');
  var mapStatus = document.getElementById('mapStatus');
  var layerToggles = document.getElementById('layerToggles');
  var floorButtons = document.getElementById('floorButtons');

  var view = null; // set once the map initializes

  function showLoggedOut(){
    sessionBar.hidden = true;
    mapView.hidden = true;
    loginView.hidden = false;
  }

  function showMapStatus(msg){
    mapStatus.hidden = false;
    mapStatus.textContent = msg;
  }
  function hideMapStatus(){
    mapStatus.hidden = true;
  }

  function initMap(token, layerUrl, displayName){
    sessionBar.hidden = false;
    loginView.hidden = true;
    mapView.hidden = false;
    pmName.textContent = displayName;

    require([
      "esri/config",
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer"
    ], function(esriConfig, Map, MapView, FeatureLayer){

      // A single app token, good for both the basemap styles service and
      // the private Units/Structures/Floors feature layers -- this
      // OAuth app (client_credentials) was granted access to exactly
      // that one item, so the token is scoped the same way here.
      esriConfig.apiKey = token;

      // layerUrl points at the Units sub-layer (".../FeatureServer/1");
      // Structures and Floors are sibling sub-layers of the same service.
      var baseUrl = layerUrl.replace(/\/\d+\/?$/, "");

      var structuresLayer = new FeatureLayer({
        url: baseUrl + "/0",
        title: "Structures",
        outFields: ["*"],
        popupTemplate: {
          title: "{StructureName}",
          content: "Address: {Address}<br>Structure ID: {StructureID}"
        }
      });

      var unitsLayer = new FeatureLayer({
        url: baseUrl + "/1",
        title: "Units",
        outFields: ["*"],
        popupTemplate: {
          title: "Unit {UnitNumber} — {UnitName}",
          content: "Status: {Status}<br>Sq Ft: {SqFt}<br>Client ID: {ClientID}"
        }
      });

      var floorsLayer = new FeatureLayer({
        url: baseUrl + "/2",
        title: "Floors",
        outFields: ["*"],
        visible: false // detail layer -- off by default, toggle in sidebar
      });

      var roomsLayer = new FeatureLayer({
        url: baseUrl + "/3",
        title: "Rooms",
        outFields: ["*"],
        visible: false, // detail layer -- off by default, toggle in sidebar
        popupTemplate: {
          title: "Room {RoomNumber}",
          content: "Type: {RoomType}<br>Sq Ft: {SqFt}<br>Unit ID: {UnitID}"
        }
      });

      var evacLayer = new FeatureLayer({
        url: baseUrl + "/4",
        title: "Evacuation Routes",
        outFields: ["*"],
        visible: false, // detail layer -- off by default, toggle in sidebar
        popupTemplate: {
          title: "Evacuation Route",
          content: "Floor ID: {FloorID}<br>Unit ID: {UnitID}"
        }
      });

      var map = new Map({
        basemap: "arcgis/topographic",
        // Draw order back-to-front: Structures on the bottom, Evacuation
        // Routes on top, so the more detailed layers are visible above the
        // coarser ones once toggled on.
        layers: [structuresLayer, floorsLayer, unitsLayer, roomsLayer, evacLayer]
      });

      // Units, Rooms, Floors, and Evacuation Routes are all scoped to a
      // FloorID -- without a floor filter, every floor of a multi-story
      // building would render stacked on top of each other at the same
      // footprint. floorScopedLayers is filtered together whenever the
      // user picks a floor (or "All floors") in the sidebar.
      var floorScopedLayers = [floorsLayer, unitsLayer, roomsLayer, evacLayer];
      var floorsByStructure = {}; // StructureID -> sorted [{FloorID, FloorNumber}, ...]
      var activeStructureId = null;
      var activeFloorId = null; // null = "All floors" (no filter)

      function setFloorFilter(floorId){
        activeFloorId = floorId;
        var expr = floorId ? "FloorID = '" + floorId.replace(/'/g, "''") + "'" : "1=1";
        floorScopedLayers.forEach(function(l){ l.definitionExpression = expr; });

        // Reflect the active choice in the floor button styling.
        var btns = floorButtons.querySelectorAll(".floor-btn");
        btns.forEach(function(btn){
          btn.classList.toggle("active", btn.dataset.floorId === (floorId || ""));
        });
      }

      function showFloorPicker(structureId){
        activeStructureId = structureId;
        var floors = floorsByStructure[structureId] || [];
        floorButtons.innerHTML = "";

        if (!floors.length){
          floorButtons.innerHTML = "<p>No floors on record for this building.</p>";
          setFloorFilter(null);
          return;
        }

        var allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "floor-btn";
        allBtn.textContent = "All floors";
        allBtn.dataset.floorId = "";
        allBtn.addEventListener("click", function(){ setFloorFilter(null); });
        floorButtons.appendChild(allBtn);

        floors.forEach(function(f){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "floor-btn";
          btn.textContent = "Floor " + f.FloorNumber;
          btn.dataset.floorId = f.FloorID;
          btn.addEventListener("click", function(){ setFloorFilter(f.FloorID); });
          floorButtons.appendChild(btn);
        });

        // Default to the first floor rather than "All floors" -- that's
        // the view that actually avoids stacked units/rooms/routes.
        setFloorFilter(floors[0].FloorID);
      }

      view = new MapView({
        container: "mapContainer",
        map: map,
        zoom: 4,
        center: [-83.98, 34.53] // Dahlonega, GA area -- reasonable default
      });

      // Sidebar checkboxes -- one per layer, user-controlled rather than
      // toggled automatically by zoom scale.
      var toggleableLayers = [
        { layer: structuresLayer, label: "Structures" },
        { layer: unitsLayer, label: "Units" },
        { layer: floorsLayer, label: "Floors" },
        { layer: roomsLayer, label: "Rooms" },
        { layer: evacLayer, label: "Evacuation Routes" }
      ];

      toggleableLayers.forEach(function(entry){
        var id = "layer-toggle-" + entry.label.toLowerCase().replace(/\s+/g, "-");

        var wrapper = document.createElement("label");
        wrapper.className = "layer-toggle";
        wrapper.setAttribute("for", id);

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = id;
        checkbox.checked = entry.layer.visible;

        checkbox.addEventListener("change", function(){
          entry.layer.visible = checkbox.checked;
        });

        var text = document.createElement("span");
        text.textContent = entry.label;

        wrapper.appendChild(checkbox);
        wrapper.appendChild(text);
        layerToggles.appendChild(wrapper);
      });

      showMapStatus("Loading properties…");

      view.when(function(){
        return Promise.all([
          structuresLayer.queryFeatures({
            where: "1=1",
            outFields: ["*"],
            returnGeometry: true
          }),
          floorsLayer.queryFeatures({
            where: "1=1",
            outFields: ["FloorID", "StructureID", "FloorNumber"],
            returnGeometry: false
          })
        ]);
      }).then(function(results){
        var structuresResult = results[0];
        var floorsResult = results[1];

        // Group floors by structure, sorted low-to-high, for the floor
        // picker shown once a building is selected.
        floorsResult.features.forEach(function(f){
          var attrs = f.attributes;
          var list = floorsByStructure[attrs.StructureID] || (floorsByStructure[attrs.StructureID] = []);
          list.push(attrs);
        });
        Object.keys(floorsByStructure).forEach(function(sid){
          floorsByStructure[sid].sort(function(a, b){ return a.FloorNumber - b.FloorNumber; });
        });

        hideMapStatus();
        bookmarkList.innerHTML = "";

        if (!structuresResult.features.length){
          bookmarkList.textContent = "No structures found.";
          return;
        }

        structuresResult.features.forEach(function(feature){
          var attrs = feature.attributes;
          var name = attrs.StructureName || ("Structure " + attrs.StructureID);
          var addr = attrs.Address || "";

          var btn = document.createElement("button");
          btn.className = "bookmark-btn";
          btn.innerHTML =
            '<span class="b-name"></span><span class="b-addr"></span>';
          btn.querySelector(".b-name").textContent = name;
          btn.querySelector(".b-addr").textContent = addr;

          btn.addEventListener("click", function(){
            // Zoom to the building...
            if (feature.geometry && feature.geometry.extent){
              view.goTo(feature.geometry.extent.expand(1.8));
            } else {
              view.goTo(feature.geometry);
            }

            // ...and scope Units/Rooms/Floors/Evacuation Routes to its floors.
            showFloorPicker(attrs.StructureID);

            var allBookmarkBtns = bookmarkList.querySelectorAll(".bookmark-btn");
            allBookmarkBtns.forEach(function(b){ b.classList.remove("active"); });
            btn.classList.add("active");
          });

          bookmarkList.appendChild(btn);
        });

        // Zoom to the full extent of all structures on first load.
        return structuresLayer.queryExtent();
      }).then(function(extentResult){
        if (extentResult && extentResult.extent){
          view.goTo(extentResult.extent.expand(1.3));
        }
      }).catch(function(err){
        showMapStatus("Could not load properties: " + (err && err.message ? err.message : err));
      });
    });
  }

  function loadPmSession(){
    fetch('/api/pm/token', { credentials: 'same-origin' })
      .then(function(res){
        if (res.status === 401) { showLoggedOut(); return null; }
        return res.json();
      })
      .then(function(data){
        if (!data) return;
        if (data.error) { showLoggedOut(); return; }
        initMap(data.token, data.layerUrl, data.displayName);
      })
      .catch(function(){ showLoggedOut(); });
  }

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    loginError.textContent = '';
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;

    fetch('/api/pm/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        if (!result.ok){
          loginError.textContent = result.data.error || 'Sign in failed.';
          return;
        }
        loadPmSession();
      })
      .catch(function(){ loginError.textContent = 'Could not reach the server. Try again.'; });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    fetch('/api/pm/logout', { method: 'POST', credentials: 'same-origin' }).then(function(){
      location.reload();
    });
  });

  // On load, see if there's already a valid PM session.
  loadPmSession();
})();
</script>
</body>
</html>
