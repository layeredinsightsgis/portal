<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layered Insights GIS — PM Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>
  :root{
    --ink:#1c231f; --ink-faint:#6b756e; --surface:#fff; --bg:#f4f5f3;
    --line:#e2e5e0; --accent:#2f6f5e; --accent-ink:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Public Sans',system-ui,sans-serif; color:var(--ink); background:var(--bg);
    display:flex; flex-direction:column;
  }
  h1,h2{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  header{
    background:var(--surface); border-bottom:1px solid var(--line); padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:15px;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.2;}
  .brand-text .name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .brand-text .sub{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .session{display:flex; align-items:center; gap:14px; font-size:14px;}
  .session .whoami{display:flex; flex-direction:column; line-height:1.25; text-align:right;}
  .session .whoami .role-line{font-weight:600;}
  .session .whoami .viewing-line{font-size:12px; color:var(--ink-faint);}
  button{
    font-family:inherit; font-size:14px; font-weight:600; border-radius:8px; cursor:pointer; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); padding:8px 14px;
  }
  button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); width:100%;}
  [hidden]{display:none !important;}

  /* ---- login ---- */
  #loginView{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px;
    width:100%; max-width:360px;
  }
  .login-card h1{font-size:22px; margin-bottom:6px;}
  .login-card p{color:var(--ink-faint); font-size:14px; margin:0 0 20px;}
  label{display:block; font-size:12px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
  input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px;
    font-family:inherit; margin-bottom:16px; background:var(--bg);
  }
  #loginError{color:#b3413a; font-size:13px; min-height:18px; margin-top:6px;}

  /* ---- map view ---- */
  #mapView{flex:1; display:flex; min-height:0;}
  #sidebar{
    width:260px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
    overflow-y:auto; padding:16px;
  }
  #sidebar h2{font-size:14px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;}
  #layerToggles{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .layer-toggle{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; cursor:pointer;}
  .layer-toggle input{width:auto; margin:0;}
  #clientSection{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  #clientSelect{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px;
    font-family:inherit; background:var(--bg); color:var(--ink);
  }
  .bookmark-btn{
    display:block; width:100%; text-align:left; background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; cursor:pointer;
  }
  .bookmark-btn:hover{border-color:var(--accent);}
  .bookmark-btn .b-name{display:block; font-weight:600; margin-bottom:2px;}
  .bookmark-btn .b-addr{display:block; color:var(--ink-faint); font-size:12px;}
  .bookmark-btn.active{border-color:var(--accent); background:#eaf2ef;}
  #floorSection{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  #floorButtons{display:flex; flex-wrap:wrap; gap:6px;}
  #floorButtons p{font-size:12px; color:var(--ink-faint); margin:0;}
  .floor-btn{
    background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px;
  }
  .floor-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  #workOrderSection{margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
  #workOrderTabs{display:flex; gap:6px; margin-bottom:10px;}
  .wo-tab{background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px;}
  .wo-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  #workOrderList p{font-size:12px; color:var(--ink-faint); margin:0;}
  .wo-item{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:8px;}
  .wo-item .wo-top{display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:12.5px; font-weight:600; margin-bottom:4px;}
  .wo-item .wo-desc{font-size:12px; margin-bottom:4px;}
  .wo-item .wo-meta{color:var(--ink-faint); font-size:11px;}
  .wo-status{font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; text-transform:uppercase; white-space:nowrap;}
  .wo-status-rep{background:#fbeedd; color:#a7671e;}
  .wo-status-wip{background:#e4efec; color:#1d4a3e;}
  .wo-status-hld{background:#f3e7e1; color:#8a5a46;}
  .wo-status-cmp{background:#e3f3ea; color:#2f7d5a;}
  #mapContainer{flex:1; position:relative;}
  #mapStatus{
    position:absolute; top:12px; left:12px; z-index:10; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:13px; color:var(--ink-faint);
  }
  #editPanel{
    position:absolute; top:12px; right:12px; z-index:20; width:280px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
  }
  #editPanel .edit-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  #editPanel .edit-head h3{font-size:14px;}
  #editPanel .edit-close{background:none; border:none; padding:0; font-size:18px; line-height:1; cursor:pointer; color:var(--ink-faint);}
  #editPanel label{font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:4px;}
  #editPanel input, #editPanel select, #editPanel textarea{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px;
    font-family:inherit; margin-bottom:10px; background:var(--bg); color:var(--ink); resize:vertical;
  }
  #editPanel input:disabled{color:var(--ink-faint);}
  .edit-actions{display:flex; gap:8px; justify-content:flex-end;}
  .edit-actions button{padding:7px 12px; font-size:13px;}
  #editUnitError{color:#b3413a; font-size:12px; min-height:16px; margin-bottom:4px;}
  #editUnitSaved{color:#2f7d5a; font-size:12px; min-height:16px; margin-bottom:4px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">LI</div>
    <div class="brand-text">
      <span class="name">Layered Insights GIS</span>
      <span class="sub">Property Manager</span>
    </div>
  </div>
  <div class="session" id="sessionBar" hidden>
    <div class="whoami">
      <span class="role-line" id="pmName"></span>
      <span class="viewing-line" id="viewingLine"></span>
    </div>
    <button id="logoutBtn">Sign out</button>
  </div>
</header>

<section id="loginView">
  <div class="login-card">
    <h1>PM Sign in</h1>
    <p>View and manage all properties on the map.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
      <div id="loginError"></div>
    </form>
  </div>
</section>

<section id="mapView" hidden>
  <div id="sidebar">
    <div id="layerToggles">
      <h2>Layers</h2>
      <!-- checkboxes populated once the map/layers exist, see initMap() -->
    </div>
    <div id="clientSection">
      <h2>Client</h2>
      <select id="clientSelect">
        <option value="">All clients</option>
      </select>
    </div>
    <div id="floorSection">
      <h2>Floor</h2>
      <div id="floorButtons"><p>Select a building below to filter by floor.</p></div>
    </div>
    <h2>Properties</h2>
    <div id="bookmarkList">Loading…</div>
    <div id="workOrderSection">
      <h2>Work Orders</h2>
      <div id="workOrderTabs">
        <button type="button" class="wo-tab active" data-tab="open">Open</button>
        <button type="button" class="wo-tab" data-tab="closed">Closed</button>
      </div>
      <div id="workOrderList"><p>Loading…</p></div>
    </div>
  </div>
  <div id="mapContainer">
    <div id="mapStatus" hidden></div>
    <div id="editPanel" hidden>
      <div class="edit-head">
        <h3 id="editPanelTitle">Edit Unit</h3>
        <button type="button" class="edit-close" id="editPanelClose">&times;</button>
      </div>
      <form id="editUnitForm">
        <label for="editUnitNumber">Unit Number</label>
        <input type="text" id="editUnitNumber" disabled>
        <label for="editUnitName">Unit Name</label>
        <input type="text" id="editUnitName">
        <label for="editUnitStatus">Status</label>
        <select id="editUnitStatus">
          <option value="ACTIVE">Active</option>
          <option value="VACANT">Vacant</option>
          <option value="RENOV">Under Renovation</option>
        </select>
        <label for="editUnitSqFt">Sq Ft</label>
        <input type="number" id="editUnitSqFt" step="1" min="0">
        <label for="editUnitNotes">Notes</label>
        <textarea id="editUnitNotes" rows="3"></textarea>
        <div id="editUnitError"></div>
        <div id="editUnitSaved"></div>
        <div class="edit-actions">
          <button type="button" id="editUnitCancel">Cancel</button>
          <button type="submit" class="primary" id="editUnitSave">Save</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script src="https://js.arcgis.com/4.30/"></script>
<script>
(function(){
  var loginView = document.getElementById('loginView');
  var mapView = document.getElementById('mapView');
  var sessionBar = document.getElementById('sessionBar');
  var pmName = document.getElementById('pmName');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var bookmarkList = document.getElementById('bookmarkList');
  var mapStatus = document.getElementById('mapStatus');
  var layerToggles = document.getElementById('layerToggles');
  var floorButtons = document.getElementById('floorButtons');
  var clientSelect = document.getElementById('clientSelect');
  var viewingLine = document.getElementById('viewingLine');
  var workOrderTabs = document.getElementById('workOrderTabs');
  var workOrderList = document.getElementById('workOrderList');
  var editPanel = document.getElementById('editPanel');
  var editPanelClose = document.getElementById('editPanelClose');
  var editUnitForm = document.getElementById('editUnitForm');
  var editUnitNumber = document.getElementById('editUnitNumber');
  var editUnitName = document.getElementById('editUnitName');
  var editUnitStatus = document.getElementById('editUnitStatus');
  var editUnitSqFt = document.getElementById('editUnitSqFt');
  var editUnitNotes = document.getElementById('editUnitNotes');
  var editUnitError = document.getElementById('editUnitError');
  var editUnitSaved = document.getElementById('editUnitSaved');
  var editUnitCancel = document.getElementById('editUnitCancel');

  var view = null; // set once the map initializes

  function showLoggedOut(){
    sessionBar.hidden = true;
    mapView.hidden = true;
    loginView.hidden = false;
  }

  function showMapStatus(msg){
    mapStatus.hidden = false;
    mapStatus.textContent = msg;
  }
  function hideMapStatus(){
    mapStatus.hidden = true;
  }

  function initMap(token, layerUrl, displayName){
    sessionBar.hidden = false;
    loginView.hidden = true;
    mapView.hidden = false;
    // The PM login has full visibility -- the account itself is always
    // "Administrator", regardless of the display_name on the pm_users row.
    pmName.textContent = "Logged in as: Administrator (" + displayName + ")";
    viewingLine.textContent = "Viewing: all clients";

    require([
      "esri/config",
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer"
    ], function(esriConfig, Map, MapView, FeatureLayer){

      // A single app token, good for both the basemap styles service and
      // the private Units/Structures/Floors feature layers -- this
      // OAuth app (client_credentials) was granted access to exactly
      // that one item, so the token is scoped the same way here.
      esriConfig.apiKey = token;

      // layerUrl points at the Units sub-layer (".../FeatureServer/1");
      // Structures and Floors are sibling sub-layers of the same service.
      var baseUrl = layerUrl.replace(/\/\d+\/?$/, "");

      var structuresLayer = new FeatureLayer({
        url: baseUrl + "/0",
        title: "Structures",
        outFields: ["*"],
        popupTemplate: {
          title: "{StructureName}",
          content: "Address: {Address}<br>Structure ID: {StructureID}"
        }
      });

      var unitsLayer = new FeatureLayer({
        url: baseUrl + "/1",
        title: "Units",
        outFields: ["*"],
        popupTemplate: {
          title: "Unit {UnitNumber} — {UnitName}",
          content: "Status: {Status}<br>Sq Ft: {SqFt}<br>Client ID: {ClientID}"
        }
      });

      var floorsLayer = new FeatureLayer({
        url: baseUrl + "/2",
        title: "Floors",
        outFields: ["*"],
        visible: false // detail layer -- off by default, toggle in sidebar
      });

      var roomsLayer = new FeatureLayer({
        url: baseUrl + "/3",
        title: "Rooms",
        outFields: ["*"],
        visible: false, // detail layer -- off by default, toggle in sidebar
        popupTemplate: {
          title: "Room {RoomNumber}",
          content: "Type: {RoomType}<br>Sq Ft: {SqFt}<br>Unit ID: {UnitID}"
        }
      });

      var evacLayer = new FeatureLayer({
        url: baseUrl + "/4",
        title: "Evacuation Routes",
        outFields: ["*"],
        visible: false, // detail layer -- off by default, toggle in sidebar
        popupTemplate: {
          title: "Evacuation Route",
          content: "Floor ID: {FloorID}<br>Unit ID: {UnitID}"
        }
      });

      var map = new Map({
        basemap: "arcgis/topographic",
        // Draw order back-to-front: Structures on the bottom, Evacuation
        // Routes on top, so the more detailed layers are visible above the
        // coarser ones once toggled on.
        layers: [structuresLayer, floorsLayer, unitsLayer, roomsLayer, evacLayer]
      });

      // Units, Rooms, Floors, and Evacuation Routes are all scoped to a
      // FloorID -- without a floor filter, every floor of a multi-story
      // building would render stacked on top of each other at the same
      // footprint. Units is also scoped to a ClientID, but Rooms/Evacuation
      // Routes only carry UnitID, so filtering those by client means
      // filtering to the set of UnitIDs that belong to that client instead.
      var floorsByStructure = {};  // StructureID -> sorted [{FloorID, FloorNumber}, ...]
      var unitIdsByClient = {};    // ClientID -> [UnitID, ...]
      var unitsById = {};          // UnitID -> {ClientID, FloorID, UnitNumber, UnitName}
      var maintenanceLogs = [];    // all MaintenanceLog rows, filtered/rendered client-side
      var activeStructureId = null;
      var activeFloorId = null;    // null = "All floors"
      var activeClientId = null;   // null = "All clients"
      var activeWoTab = "open";    // "open" or "closed"

      var WO_STATUS_LABELS = { REP: "Reported", WIP: "In Progress", HLD: "Holding for Parts", CMP: "Completed" };
      var WO_STATUS_CLASS = { REP: "wo-status-rep", WIP: "wo-status-wip", HLD: "wo-status-hld", CMP: "wo-status-cmp" };
      var WO_ISSUE_LABELS = {
        ELE: "Electrical", PLU: "Plumbing", HVAC: "Heating/Cooling", MINCON: "Minor Construction",
        MAJCON: "Major Construction", ACC: "Access Controls", FIRSYS: "Fire System", DORWIN: "Doors/Windows"
      };

      function sqlQuote(value){
        return "'" + String(value).replace(/'/g, "''") + "'";
      }

      function applyFilters(){
        var floorClause = activeFloorId ? "FloorID = " + sqlQuote(activeFloorId) : "1=1";

        if (!activeClientId){
          floorsLayer.definitionExpression = floorClause;
          unitsLayer.definitionExpression = floorClause;
          roomsLayer.definitionExpression = floorClause;
          evacLayer.definitionExpression = floorClause;
        } else {
          var unitIds = unitIdsByClient[activeClientId] || [];
          // No matching units -- "IN ()" is invalid SQL, so fall back to a
          // clause that matches nothing rather than accidentally matching
          // everything.
          var unitIdClause = unitIds.length
            ? "UnitID IN (" + unitIds.map(sqlQuote).join(",") + ")"
            : "1=0";

          floorsLayer.definitionExpression = floorClause; // building footprints aren't client-specific
          unitsLayer.definitionExpression = floorClause + " AND ClientID = " + sqlQuote(activeClientId);
          roomsLayer.definitionExpression = floorClause + " AND " + unitIdClause;
          evacLayer.definitionExpression = floorClause + " AND " + unitIdClause;
        }

        // Reflect the active floor in the floor button styling.
        var btns = floorButtons.querySelectorAll(".floor-btn");
        btns.forEach(function(btn){
          btn.classList.toggle("active", btn.dataset.floorId === (activeFloorId || ""));
        });

        renderWorkOrders();
      }

      // MaintenanceLog only carries a UnitID (no FloorID/ClientID of its
      // own), so it's scoped to the current floor/client by checking each
      // log's UnitID against unitsById -- the same lookup built from the
      // Units query below.
      function renderWorkOrders(){
        var isClosed = function(status){ return status === "CMP"; };

        var scoped = maintenanceLogs.filter(function(log){
          var unit = unitsById[log.UnitID];
          if (activeFloorId && (!unit || unit.FloorID !== activeFloorId)) return false;
          if (activeClientId && (!unit || unit.ClientID !== activeClientId)) return false;
          return activeWoTab === "closed" ? isClosed(log.Status) : !isClosed(log.Status);
        });

        // Update tab labels with live counts for whichever scope is active.
        var openCount = maintenanceLogs.filter(function(log){
          var unit = unitsById[log.UnitID];
          if (activeFloorId && (!unit || unit.FloorID !== activeFloorId)) return false;
          if (activeClientId && (!unit || unit.ClientID !== activeClientId)) return false;
          return !isClosed(log.Status);
        }).length;
        var closedCount = maintenanceLogs.length ? (function(){
          var count = 0;
          maintenanceLogs.forEach(function(log){
            var unit = unitsById[log.UnitID];
            if (activeFloorId && (!unit || unit.FloorID !== activeFloorId)) return;
            if (activeClientId && (!unit || unit.ClientID !== activeClientId)) return;
            if (isClosed(log.Status)) count++;
          });
          return count;
        })() : 0;

        workOrderTabs.querySelector('[data-tab="open"]').textContent = "Open (" + openCount + ")";
        workOrderTabs.querySelector('[data-tab="closed"]').textContent = "Closed (" + closedCount + ")";

        workOrderList.innerHTML = "";
        if (!scoped.length){
          workOrderList.innerHTML = "<p>No " + activeWoTab + " work orders" + (activeFloorId || activeClientId ? " for this selection." : ".") + "</p>";
          return;
        }

        scoped.forEach(function(log){
          var unit = unitsById[log.UnitID];
          var unitLabel = unit ? ("Unit " + (unit.UnitNumber || unit.UnitID)) : ("Unit " + (log.UnitID || "—"));

          var item = document.createElement("div");
          item.className = "wo-item";

          var top = document.createElement("div");
          top.className = "wo-top";
          var issueSpan = document.createElement("span");
          issueSpan.textContent = WO_ISSUE_LABELS[log.IssueType] || log.IssueType || "Issue";
          var statusSpan = document.createElement("span");
          statusSpan.className = "wo-status " + (WO_STATUS_CLASS[log.Status] || "wo-status-rep");
          statusSpan.textContent = WO_STATUS_LABELS[log.Status] || log.Status || "";
          top.appendChild(issueSpan);
          top.appendChild(statusSpan);

          var desc = document.createElement("div");
          desc.className = "wo-desc";
          desc.textContent = log.Description || "";

          var meta = document.createElement("div");
          meta.className = "wo-meta";
          var reportedDate = log.DateReported ? new Date(log.DateReported).toLocaleDateString() : "—";
          meta.textContent = unitLabel + " · Reported " + reportedDate + (log.ReportedBy ? " by " + log.ReportedBy : "");

          item.appendChild(top);
          if (log.Description) item.appendChild(desc);
          item.appendChild(meta);
          workOrderList.appendChild(item);
        });
      }

      workOrderTabs.addEventListener("click", function(e){
        var btn = e.target.closest(".wo-tab");
        if (!btn) return;
        activeWoTab = btn.dataset.tab;
        workOrderTabs.querySelectorAll(".wo-tab").forEach(function(b){ b.classList.toggle("active", b === btn); });
        renderWorkOrders();
      });

      function setFloorFilter(floorId){
        activeFloorId = floorId;
        applyFilters();
      }

      function showFloorPicker(structureId){
        activeStructureId = structureId;
        var floors = floorsByStructure[structureId] || [];
        floorButtons.innerHTML = "";

        if (!floors.length){
          floorButtons.innerHTML = "<p>No floors on record for this building.</p>";
          setFloorFilter(null);
          return;
        }

        var allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "floor-btn";
        allBtn.textContent = "All floors";
        allBtn.dataset.floorId = "";
        allBtn.addEventListener("click", function(){ setFloorFilter(null); });
        floorButtons.appendChild(allBtn);

        floors.forEach(function(f){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "floor-btn";
          btn.textContent = "Floor " + f.FloorNumber;
          btn.dataset.floorId = f.FloorID;
          btn.addEventListener("click", function(){ setFloorFilter(f.FloorID); });
          floorButtons.appendChild(btn);
        });

        // Default to the first floor rather than "All floors" -- that's
        // the view that actually avoids stacked units/rooms/routes.
        setFloorFilter(floors[0].FloorID);
      }

      clientSelect.addEventListener("change", function(){
        activeClientId = clientSelect.value || null;
        viewingLine.textContent = "Viewing: " + (clientSelect.options[clientSelect.selectedIndex].textContent);
        applyFilters();
      });

      view = new MapView({
        container: "mapContainer",
        map: map,
        zoom: 4,
        center: [-83.98, 34.53] // Dahlonega, GA area -- reasonable default
      });

      // Clicking a Unit opens the edit panel (in addition to its normal
      // popup) -- hitTest is scoped to unitsLayer only so clicking a
      // Structure/Room/etc. doesn't trigger it.
      view.on("click", function(event){
        view.hitTest(event, { include: unitsLayer }).then(function(response){
          var result = response.results && response.results[0];
          if (result && result.graphic) openEditPanel(result.graphic.attributes);
        });
      });

      // Sidebar checkboxes -- one per layer, user-controlled rather than
      // toggled automatically by zoom scale.
      var toggleableLayers = [
        { layer: structuresLayer, label: "Structures" },
        { layer: unitsLayer, label: "Units" },
        { layer: floorsLayer, label: "Floors" },
        { layer: roomsLayer, label: "Rooms" },
        { layer: evacLayer, label: "Evacuation Routes" }
      ];

      toggleableLayers.forEach(function(entry){
        var id = "layer-toggle-" + entry.label.toLowerCase().replace(/\s+/g, "-");

        var wrapper = document.createElement("label");
        wrapper.className = "layer-toggle";
        wrapper.setAttribute("for", id);

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = id;
        checkbox.checked = entry.layer.visible;

        checkbox.addEventListener("change", function(){
          entry.layer.visible = checkbox.checked;
        });

        var text = document.createElement("span");
        text.textContent = entry.label;

        wrapper.appendChild(checkbox);
        wrapper.appendChild(text);
        layerToggles.appendChild(wrapper);
      });

      // The Clients table (a non-spatial table on the same FeatureServer)
      // and the Units-to-ClientID mapping aren't map layers, so they're
      // queried directly over REST rather than through a FeatureLayer.
      function queryTable(index, params){
        var url = new URL(baseUrl + "/" + index + "/query");
        Object.keys(params).forEach(function(k){ url.searchParams.set(k, params[k]); });
        url.searchParams.set("token", token);
        url.searchParams.set("f", "json");
        return fetch(url.toString()).then(function(res){ return res.json(); });
      }

      // Shared applyEdits helper -- geometry is never touched here (that
      // stays in ArcGIS Pro); this only ever sends attribute updates.
      // `updatesArray` must be the JSON array of edits itself (each item
      // like {attributes: {...}}), not wrapped in another object -- the
      // REST operation's "updates" param is that array, stringified.
      function applyEdits(index, updatesArray){
        var url = baseUrl + "/" + index + "/applyEdits";
        var body = new URLSearchParams({
          f: "json",
          token: token,
          updates: JSON.stringify(updatesArray)
        });
        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString()
        }).then(function(res){ return res.json(); });
      }

      // ---- Unit attribute editing (click a unit on the map) ----
      var editingObjectId = null;
      var editingUnitId = null;

      function openEditPanel(attrs){
        editingObjectId = attrs[unitsLayer.objectIdField];
        editingUnitId = attrs.UnitID;
        editUnitError.textContent = "";
        editUnitSaved.textContent = "";
        editUnitNumber.value = attrs.UnitNumber || "";
        editUnitName.value = attrs.UnitName || "";
        editUnitStatus.value = attrs.Status || "ACTIVE";
        editUnitSqFt.value = (attrs.SqFt !== null && attrs.SqFt !== undefined) ? attrs.SqFt : "";
        editUnitNotes.value = attrs.Notes || "";
        editPanel.hidden = false;
      }

      function closeEditPanel(){
        editPanel.hidden = true;
        editingObjectId = null;
      }

      editPanelClose.addEventListener("click", closeEditPanel);
      editUnitCancel.addEventListener("click", closeEditPanel);

      editUnitForm.addEventListener("submit", function(e){
        e.preventDefault();
        if (editingObjectId === null) return;
        editUnitError.textContent = "";
        editUnitSaved.textContent = "";

        var updatedAttrs = {};
        updatedAttrs[unitsLayer.objectIdField] = editingObjectId;
        updatedAttrs.UnitName = editUnitName.value || null;
        updatedAttrs.Status = editUnitStatus.value;
        updatedAttrs.SqFt = editUnitSqFt.value === "" ? null : Number(editUnitSqFt.value);
        updatedAttrs.Notes = editUnitNotes.value || null;

        applyEdits(1, [{ attributes: updatedAttrs }]).then(function(result){
          // Surface whatever ArcGIS actually returned rather than a
          // guessed message -- a request-level failure (bad token, no
          // write permission on the OAuth app, etc.) comes back as a
          // top-level {error: {...}} instead of updateResults.
          if (result.error){
            editUnitError.textContent = "ArcGIS error " + (result.error.code || "") + ": " + (result.error.message || JSON.stringify(result.error));
            return;
          }

          var updateResult = result.updateResults && result.updateResults[0];
          if (!updateResult || !updateResult.success){
            var msg = (updateResult && updateResult.error && (updateResult.error.description || updateResult.error.message))
              || ("Unexpected response: " + JSON.stringify(result));
            editUnitError.textContent = msg;
            return;
          }

          // Keep the local unit cache in sync so the client filter and
          // work-order labels reflect the edit without a full reload.
          var unit = unitsById[editingUnitId];
          if (unit){
            unit.UnitName = updatedAttrs.UnitName;
            unit.Status = updatedAttrs.Status;
            unit.SqFt = updatedAttrs.SqFt;
            unit.Notes = updatedAttrs.Notes;
          }

          editUnitSaved.textContent = "Saved.";
          unitsLayer.refresh();
        }).catch(function(err){
          editUnitError.textContent = "Could not reach the server: " + (err && err.message ? err.message : err);
        });
      });

      showMapStatus("Loading properties…");

      view.when(function(){
        return Promise.all([
          structuresLayer.queryFeatures({
            where: "1=1",
            outFields: ["*"],
            returnGeometry: true
          }),
          floorsLayer.queryFeatures({
            where: "1=1",
            outFields: ["FloorID", "StructureID", "FloorNumber"],
            returnGeometry: false
          }),
          queryTable(7, { where: "1=1", outFields: "ClientID,ClientName" }),
          unitsLayer.queryFeatures({
            where: "1=1",
            outFields: ["UnitID", "ClientID", "FloorID", "UnitNumber", "UnitName"],
            returnGeometry: false
          }),
          queryTable(9, {
            where: "1=1",
            outFields: "UnitID,DateReported,IssueType,Description,ReportedBy,Status,DateResolved"
          })
        ]);
      }).then(function(results){
        var structuresResult = results[0];
        var floorsResult = results[1];
        var clientsResult = results[2];
        var allUnitsResult = results[3];
        var maintenanceLogResult = results[4];

        // Group floors by structure, sorted low-to-high, for the floor
        // picker shown once a building is selected.
        floorsResult.features.forEach(function(f){
          var attrs = f.attributes;
          var list = floorsByStructure[attrs.StructureID] || (floorsByStructure[attrs.StructureID] = []);
          list.push(attrs);
        });
        Object.keys(floorsByStructure).forEach(function(sid){
          floorsByStructure[sid].sort(function(a, b){ return a.FloorNumber - b.FloorNumber; });
        });

        // Build the UnitID -> {ClientID, FloorID, UnitNumber, UnitName}
        // lookup used for the client filter (Rooms/Evacuation Routes only
        // carry UnitID, not ClientID) and for scoping work orders by
        // floor/client (MaintenanceLog only carries UnitID).
        allUnitsResult.features.forEach(function(f){
          var attrs = f.attributes;
          unitsById[attrs.UnitID] = attrs;
          if (attrs.ClientID){
            var list = unitIdsByClient[attrs.ClientID] || (unitIdsByClient[attrs.ClientID] = []);
            list.push(attrs.UnitID);
          }
        });

        maintenanceLogs = (maintenanceLogResult.features || []).map(function(f){ return f.attributes; });

        // Populate the client dropdown from the Clients table.
        var clientFeatures = (clientsResult.features || []).slice().sort(function(a, b){
          return (a.attributes.ClientName || "").localeCompare(b.attributes.ClientName || "");
        });
        clientFeatures.forEach(function(f){
          var attrs = f.attributes;
          var option = document.createElement("option");
          option.value = attrs.ClientID;
          option.textContent = attrs.ClientName || attrs.ClientID;
          clientSelect.appendChild(option);
        });

        hideMapStatus();
        bookmarkList.innerHTML = "";

        if (!structuresResult.features.length){
          bookmarkList.textContent = "No structures found.";
          return;
        }

        structuresResult.features.forEach(function(feature){
          var attrs = feature.attributes;
          var name = attrs.StructureName || ("Structure " + attrs.StructureID);
          var addr = attrs.Address || "";

          var btn = document.createElement("button");
          btn.className = "bookmark-btn";
          btn.innerHTML =
            '<span class="b-name"></span><span class="b-addr"></span>';
          btn.querySelector(".b-name").textContent = name;
          btn.querySelector(".b-addr").textContent = addr;

          btn.addEventListener("click", function(){
            // Zoom to the building...
            if (feature.geometry && feature.geometry.extent){
              view.goTo(feature.geometry.extent.expand(1.8));
            } else {
              view.goTo(feature.geometry);
            }

            // ...and scope Units/Rooms/Floors/Evacuation Routes to its floors.
            showFloorPicker(attrs.StructureID);

            var allBookmarkBtns = bookmarkList.querySelectorAll(".bookmark-btn");
            allBookmarkBtns.forEach(function(b){ b.classList.remove("active"); });
            btn.classList.add("active");
          });

          bookmarkList.appendChild(btn);
        });

        // Show all open work orders by default, before any building/client is picked.
        renderWorkOrders();

        // Zoom to the full extent of all structures on first load.
        return structuresLayer.queryExtent();
      }).then(function(extentResult){
        if (extentResult && extentResult.extent){
          view.goTo(extentResult.extent.expand(1.3));
        }
      }).catch(function(err){
        showMapStatus("Could not load properties: " + (err && err.message ? err.message : err));
      });
    });
  }

  function loadPmSession(){
    fetch('/api/pm/token', { credentials: 'same-origin' })
      .then(function(res){
        if (res.status === 401) { showLoggedOut(); return null; }
        return res.json();
      })
      .then(function(data){
        if (!data) return;
        if (data.error) { showLoggedOut(); return; }
        initMap(data.token, data.layerUrl, data.displayName);
      })
      .catch(function(){ showLoggedOut(); });
  }

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    loginError.textContent = '';
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;

    fetch('/api/pm/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        if (!result.ok){
          loginError.textContent = result.data.error || 'Sign in failed.';
          return;
        }
        loadPmSession();
      })
      .catch(function(){ loginError.textContent = 'Could not reach the server. Try again.'; });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    fetch('/api/pm/logout', { method: 'POST', credentials: 'same-origin' }).then(function(){
      location.reload();
    });
  });

  // On load, see if there's already a valid PM session.
  loadPmSession();
})();
</script>
</body>
</html>
